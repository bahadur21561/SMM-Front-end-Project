<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Followers Store - انشاء حساب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <header>
            <nav class="top-nav">
                <div class="menu-icon" id="menuBtn">
                    <i class="fa-solid fa-bars"></i>
                </div>
                <div class="logo">
                    <span>Followers Store</span>
                    <i class="fa-solid fa-rocket" style="color: #6a1b9a;"></i>
                </div>
            </nav>

            <div class="mobile-menu" id="mobileMenu">
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="#">تسجيل الدخول</a></li>
                    <li><a href="#">انشاء الحساب</a></li>
                    <li><a href="#">الخدمات</a></li>
                    <li><a href="#">الدعم الفني</a></li>
                </ul>
            </div>
        </header>

<section class="signup-section">
            <div class="page-title">
                <h2>انشاء حساب</h2>
                <p>جميع التواصل الاجتماعي في مكان واحد</p>
            </div>

            <div class="signup-card">
                <form action="#">
                    <div class="input-group">
                        <label>اسم المستخدم</label>
                        <div class="input-with-icon">
                            <input type="text" placeholder="أدخل اسم المستخدم" required>
                            <i class="fa-solid fa-pen"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>الاسم الاول</label>
                        <div class="input-with-icon">
                            <input type="text" placeholder="أدخل الاسم الاول" required>
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>الاسم الاخير</label>
                        <div class="input-with-icon">
                            <input type="text" placeholder="أدخل الاسم الاخير" required>
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>

                    <div class="phone-row">
                        <div class="input-group phone-input">
                            <label>الهاتف</label>
                            <div class="input-with-icon">
                                <input type="tel" placeholder="أدخل رقم الهاتف" required>
                                <i class="fa-solid fa-phone"></i>
                            </div>
                        </div>
                        <div class="input-group country-code">
                            <label>الرمز</label>
                            <div class="code-select">
                                <img src="https://flagcdn.com/w40/eg.png" alt="Egypt" width="20">
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>البريد الإلكتروني</label>
                        <div class="input-with-icon">
                            <input type="email" placeholder="أدخل بريدك الإلكتروني" required>
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>كلمة المرور</label>
                        <div class="input-with-icon">
                            <input type="password" placeholder="أدخل كلمة المرور الخاصة بك" required>
                            <i class="fa-solid fa-lock"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>تأكيد كلمة المرور</label>
                        <div class="input-with-icon">
                            <input type="password" placeholder="اعد ادخال كلمة المرور" required>
                            <i class="fa-solid fa-lock"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary signup-btn">انشاء الحساب</button>
                    
                    <div class="form-footer">
                        <p>هل لديك حساب بالفعل ؟ <a href="index.html">تسجيل الدخول</a></p>
                    </div>
                </form>
            </div>
        </section>

        <footer>
            <div class="footer-logo">
                <i class="fa-solid fa-rocket" style="color: #6a1b9a;"></i> 
                <strong>Followers Store</strong>
            </div>
            <p class="copyright">كل أدواتك الرقمية تحت سقف واحد - إدارة جميع حساباتك من مكان واحد.</p>
            
            <div class="footer-contact">
                <h4>تواصل معنا</h4>
                <div class="social-links">
                    <a href="#"><i class="fa-brands fa-telegram"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                </div>
                <p class="support-text"><i class="fa-solid fa-headset"></i> تواصل مع الدعم الفني</p>
            </div>
        </footer>

    </div>

    <script src="js/main.js"></script>
</body>
</html>
