<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Followers Store - الدعم الفني</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="chat-bg"> <div class="container chat-container">
        
        <div class="chat-header">
            <div class="header-right">
                <a href="index.html" class="back-btn"><i class="fa-solid fa-chevron-right"></i></a>
                <h2>Support</h2>
            </div>
            <div class="header-left">
                <button class="icon-btn"><i class="fa-solid fa-phone"></i></button>
                <button class="icon-btn"><i class="fa-solid fa-ellipsis"></i></button>
            </div>
        </div>

        <div class="chat-body">
            
            <div class="message incoming">
                <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" alt="Support" class="msg-avatar">
                <div class="msg-content">
                    <p>أهلاً، كيف أقدر أساعدك؟</p>
                </div>
                <div class="msg-reaction-add"><i class="fa-regular fa-face-smile"></i></div>
            </div>

            <div class="message outgoing">
                <div class="msg-content">
                    <p>أواجه مشكلة عند محاولة شراء باكدج Instagram.</p>
                </div>
                <img src="https://ui-avatars.com/api/?name=Mostafa&background=random" alt="User" class="msg-avatar">
                <div class="msg-reaction-add"><i class="fa-regular fa-face-smile"></i></div>
            </div>

            <div class="reactions-bar">
                <span>❤️</span><span>😂</span><span>😢</span><span>😡</span><span>😯</span><span>👍</span>
            </div>

            <div class="typing-indicator">
                <p>محمد يكتب الان .....</p>
            </div>

        </div>

        <div class="chat-footer">
            <button class="mic-btn"><i class="fa-solid fa-microphone"></i></button>
            <div class="input-wrapper">
                <input type="text" placeholder="اكتب رسالتك ...">
            </div>
            <button class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>

    </div>

    <script src="js/main.js"></script>
</body>
</html>
