<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Followers Store - طلب الخدمة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <header>
            <nav class="top-nav">
                <div class="menu-icon" id="menuBtn">
                    <i class="fa-solid fa-bars"></i>
                </div>
                <div class="logo">
                    <span>Followers Store</span>
                    <i class="fa-solid fa-rocket" style="color: #6a1b9a;"></i>
                </div>
            </nav>
            <div class="mobile-menu" id="mobileMenu">
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="sing_up.html">انشاء الحساب</a></li>
                    <li><a href="service_page.html">الخدمات</a></li>
                </ul>
            </div>
        </header>

        <section class="order-section fade-in">
            <h2 class="page-title-simple">طلب الخدمة</h2>
            <p class="section-desc text-center">املأ البيانات أدناه لإكمال طلبك والحصول على الخدمة بسرعة وأمان.</p>

            <div class="signup-card"> <form id="orderForm">
                    <div class="input-group">
                        <label class="text-white">اسم المستخدم</label>
                        <input type="text" value="Mg128s" readonly class="input-display">
                    </div>

                    <div class="input-group">
                        <label class="text-white">القسم</label>
                        <input type="text" value="Snapchat" readonly class="input-display">
                    </div>

                    <div class="input-group">
                        <label class="text-white">الباكدج المختار</label>
                        <input type="text" value="باكدج 1#" readonly class="input-display">
                    </div>

                    <div class="input-group">
                        <label class="text-white">عدد المتابعين المطلوب</label>
                        <input type="text" value="500 متابع" readonly class="input-display">
                    </div>

                    <div class="input-group">
                        <label class="text-white">البريد الإلكتروني</label>
                        <input type="email" value="Mg128s@gmail.com" readonly class="input-display">
                    </div>

                    <div class="input-group">
                        <label class="text-white">ثمن الطلب</label>
                        <input type="text" value="10$" readonly class="input-display">
                    </div>

                    <div class="input-group">
                        <label class="text-white">الرابط</label>
                        <input type="url" placeholder="ضع رابط الحساب هنا" required class="input-display editable">
                    </div>

                    <button type="submit" class="btn-primary signup-btn">ارسال الطلب</button>
                </form>
            </div>
        </section>

        <footer>
            <div class="footer-logo">
                <i class="fa-solid fa-rocket" style="color: #6a1b9a;"></i> 
                <strong>Followers Store</strong>
            </div>
            <p class="copyright">كل أدواتك الرقمية تحت سقف واحد.</p>
            <div class="footer-contact">
                <h4>تواصل معنا</h4>
                <div class="social-links">
                    <a href="#"><i class="fa-brands fa-telegram"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>
        </footer>

    </div>
    <script src="js/main.js"></script>
    <script>
        // سكريبت بسيط لتحويل المستخدم لصفحة النجاح عند الضغط
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault(); // منع إعادة تحميل الصفحة
            window.location.href = 'order_success.html'; // الانتقال لصفحة النجاح
        });
    </script>
</body>
</html>
