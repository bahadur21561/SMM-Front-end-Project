<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Followers Store - New Order</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { direction: ltr !important; text-align: left !important; font-family: 'Poppins', sans-serif; }
        .input-group label { text-align: left !important; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <nav class="top-nav">
                <div class="logo">
                    <i class="fa-solid fa-rocket" style="color: #6a1b9a;"></i>
                    <span>Followers Store</span>
                </div>
                <div class="menu-icon" id="menuBtn">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>

            <!-- Corrected Logged In Mobile Menu -->
            <div class="mobile-menu" id="mobileMenu">
                <ul>
                    <li><a href="order_request.html">New Order</a></li>
                    <li><a href="orders.html">My Orders</a></li>
                    <li><a href="add_fundes.html">Add Funds</a></li>
                    <li><a href="service_page.html">Services</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="#" id="logoutBtn" style="color: #ff4d4d;">Logout</a></li>
                </ul>
            </div>
        </header>

        <section class="order-section" style="padding: 20px;">
            <h2 style="text-align: center; margin-bottom: 20px;">Place New Order</h2>
            
            <div class="order-card">
                <form id="orderForm">
                    <!-- Dynamic Category Dropdown -->
                    <div class="input-group">
                        <label>Category</label>
                        <select id="categorySelect" required>
                            <option value="">Loading categories...</option>
                        </select>
                    </div>

                    <!-- Dynamic Service Dropdown -->
                    <div class="input-group" style="margin-top: 15px;">
                        <label>Select Service / Package</label>
                        <select id="serviceSelect" required>
                            <option value="">Select Category First</option>
                        </select>
                    </div>

                    <!-- Quantity Input -->
                    <div class="input-group" style="margin-top: 15px;">
                        <label>Quantity</label>
                        <input type="number" id="orderQuantity" placeholder="Enter quantity" min="100" required>
                    </div>

                    <!-- Dynamic Calculated Price -->
                    <div class="input-group" style="margin-top: 15px;">
                        <label>Total Price ($)</label>
                        <input type="text" id="orderPrice" value="$0.00" readonly style="background-color: #f0f0f0;">
                    </div>

                    <!-- Target Link -->
                    <div class="input-group" style="margin-top: 15px;">
                        <label>Target Link / Username</label>
                        <input type="url" id="targetLink" placeholder="Paste your profile/post link here" required>
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 20px; width: 100%;">Submit Order</button>
                </form>
            </div>
        </section>
    </div>

    <!-- Supabase JS SDK & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/orders.js"></script> <!-- We will create this for fetch logic -->

</body>
</html>
